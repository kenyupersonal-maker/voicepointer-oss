<title>CompletionDemo</title>
<!-- 完成页演示（可直接打包进 app 的 WKWebView 页面）。画布 560×184，背景透明；卡片底色、设备切换、图例、说明文字都由原生 SwiftUI 负责。
     原生 → 网页：window.demo.configure({device:'trackpad'|'mouse', dark:Bool, reduce:Bool})；window.demo.setScene('up'|'stop'|'down')（切场景并从头播放）；window.demo.start()；window.demo.stop()
     网页 → 原生：webkit.messageHandlers.demo.postMessage({scene:'up'|'stop'|'down', progress:0..1})，约每 100ms 一次，用来高亮图例和画进度条。
     没有任何网络请求，不读任何本机数据。 -->
<style>

}

*{box-sizing:border-box;margin:0}
html,body{background:transparent;width:560px;height:184px;overflow:hidden;font-family:-apple-system,"SF Pro Text","PingFang SC",sans-serif}
svg{display:block}
svg.i{fill:none;stroke:currentColor}
/* demo svg */
.pad{fill:var(--pad);stroke:var(--padline);stroke-width:1.2}
.padin{fill:none;stroke:var(--padin);stroke-width:1}
.tring{fill:none;stroke:var(--accent);stroke-width:2.2;opacity:0}
.rip{fill:none;stroke:var(--accent);stroke-width:1.6;opacity:0}
.win2{fill:var(--win);stroke:var(--line);stroke-width:1}
.wdot{fill:var(--line)}
.field{fill:var(--card);stroke:var(--line);stroke-width:1}
.ph{fill:var(--ter);font-size:11.5px}
.typed{fill:var(--text);font-size:11.5px}
.caret{fill:var(--accent)}
.bub{fill:var(--accent)}
.bubt{fill:#fff;font-size:11.5px}
.mini{fill:var(--sec);font-size:10.5px}
.dBase{fill:#fff}
.dRing{fill:none;stroke:rgba(0,0,0,.08);stroke-width:1}
.core{fill:#f1f2f5;stroke:rgba(0,0,0,.06);stroke-width:1}
.lab{font-size:9.6px;font-weight:500;letter-spacing:.3px;fill:rgba(0,0,0,.45)}
.bar{fill:#22a950}
.arr{fill:none;stroke:var(--accent);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.arrl{stroke:var(--accent);stroke-width:2.4;stroke-linecap:round;stroke-dasharray:1 6;fill:none}

  const fingOff=(1-land)*16;

  const set=F=>F.forEach(f=>{f.ring.style.opacity=hold?.55*ez((t-.55)/.15):0;f.rip.setAttribute('r',11+18*ripP);f.rip.style.opacity=ripP>0&&ripP<1?(1-ripP)*.55:0});
  set(FP);set(FM);
  const pr=hold?ez((t-.55)/.2):0;
  const hpE=$('#hp-hand');hpE.setAttribute('transform',`translate(0 ${(dy+fingOff).toFixed(2)})`);hpE.style.opacity=fOp;hpE.style.setProperty('--press',pr.toFixed(3));
  $('#hm-move').setAttribute('transform',`translate(0 ${dy.toFixed(2)})`);
  const hmE=$('#hm-hand');hmE.setAttribute('transform',`translate(0 ${fingOff.toFixed(2)})`);hmE.style.opacity=fOp;hmE.style.setProperty('--press',pr.toFixed(3));
  // 箭头
  const aOp=push*(1-ez((t-R)/.2))*endF;
  $('#arUp').style.opacity=dir<0?aOp:0;$('#arDn').style.opacity=dir>0?aOp:0;
  // 文字
  if(!TXT_W){TXT_W=($('#typed').getComputedTextLength()||150)+4}
  let frac=cl((t-.95)/1.3);
  if(sc==='down')frac*=(1-relE);
  let tOp=1;if(sc==='up')tOp=1-ez((t-R-.05)/.25);
  const w=TXT_W*frac;
  $('#tclip').setAttribute('width',w.toFixed(1));$('#typed').style.opacity=tOp*endF;
  $('#ph').style.opacity=(w<1.5?1:0)*(sc==='up'&&t>R?ez((t-R-.2)/.3):1)*endF;
  const caretX=TXT_X+(sc==='up'&&t>R?0:w)+1;
  $('#caret').setAttribute('x',caretX.toFixed(1));$('#caret').style.opacity=(.35+.65*(Math.sin(t*7)>0?1:.15))*endF*((t>.85)?1:0);
  // 圆盘
  const dIn=ez((t-.75)/.35);
  const aimUp=dir<0?push:0,aimDn=dir>0?push:0,aim=Math.max(aimUp,aimDn);
  let sx=.88+.12*dIn,ty=0,op=dIn;
  if(!hold){
    if(sc==='up'){ty=-78*ez(rel);sx*=1+.12*rel;op*=1-ez((rel-.1)/.8)}
    else if(sc==='stop'){sx*=1-.06*relE;op*=1-relE}
    else{sx*=1-.85*relE;op*=1-ez((rel-.2)/.8)}
  }
  $('#discG').setAttribute('transform','translate(390 78)');
  $('#discS').setAttribute('transform',`translate(0 ${ty.toFixed(1)}) scale(${sx.toFixed(3)})`);$('#discS').style.opacity=op*endF;
  $('#dBase').style.opacity=1-.86*aim;$('#gUp').style.opacity=aimUp;$('#gDn').style.opacity=aimDn;
  $('.dRing#x');
  const lab=(id,a,other)=>{const e=$(id);e.style.fill=a>.02?`rgba(255,255,255,${.75+.25*a})`:'';e.style.opacity=other>.02?1-.65*other:1;e.style.fontWeight=a>.5?'650':''};
  lab('#lSend',aimUp,aimDn);lab('#lCancel',aimDn,aimUp);
  const amp=(t>.9&&hold)?(.4+.6*Math.abs(Math.sin(t*5.1)*Math.cos(t*2.3+1))):(hold?0.12:0);
  BARS.forEach((b,i)=>{const h=Math.max(3,b.h*(.35+amp*(.65+.35*Math.sin(t*9+i*1.3))));b.e.setAttribute('height',h.toFixed(1));b.e.setAttribute('y',(-h/2).toFixed(1))});
  // 结果
  const sent=$('#bubble');const b=sc==='up'?ez((t-R-.3)/.3):0;
  sent.style.opacity=b*endF;sent.setAttribute('transform',`translate(0 ${(12*(1-b)).toFixed(1)})`);
  $('#sent').style.opacity=sc==='up'?ez((t-R-.55)/.3)*endF:0;
  $('#res').textContent=RES[sc];$('#res').style.opacity=sc==='up'?0:ez((t-R-.35)/.3)*endF;
  const now=performance.now();
  if(now-DEMO.lastPost>100||DEMO.still!==null){DEMO.lastPost=now;try{window.webkit&&window.webkit.messageHandlers.demo.postMessage({scene:sc,progress:+(t/DEMO.T).toFixed(3)})}catch(e){}}
}
function demoTick(ts){
  if(!DEMO.run)return;
  const dt=Math.min(.1,(ts-DEMO.last)/1000);DEMO.last=ts;DEMO.t+=dt;
  if(DEMO.t>=DEMO.T){DEMO.t=0;const o=['up','stop','down'];DEMO.sc=o[(o.indexOf(DEMO.sc)+1)%3]}
  demoFrame();DEMO.raf=requestAnimationFrame(demoTick)}
function applyDev(){$('#devPad').style.display=DEMO.dev==='trackpad'?'':'none';$('#devMouse').style.display=DEMO.dev==='mouse'?'':'none'}
const STILL_T={up:3.15,stop:2.9,down:3.15};
window.demo={
  configure(o){if(o.device){DEMO.dev=o.device;applyDev()}if(o.dark!==undefined)document.documentElement.dataset.theme=o.dark?'dark':'light';if(o.reduce!==undefined)DEMO.reduce=!!o.reduce;this.start()},
  setScene(sc){DEMO.sc=sc;DEMO.t=0;this.start()},
  start(){cancelAnimationFrame(DEMO.raf);if(DEMO.reduce){DEMO.run=false;DEMO.still=STILL_T[DEMO.sc];demoFrame();return}DEMO.still=null;DEMO.t=0;DEMO.run=true;DEMO.last=performance.now();DEMO.raf=requestAnimationFrame(demoTick)},
  stop(){DEMO.run=false;cancelAnimationFrame(DEMO.raf)}
};
// 预览用：?dev=mouse&scene=down&tt=3.15&dark=1
const q=new URLSearchParams(location.search);
applyDev();
if(q.get('dev'))DEMO.dev=q.get('dev');if(q.get('scene'))DEMO.sc=q.get('scene');if(q.get('dark')==='1')document.documentElement.dataset.theme='dark';
applyDev();
if(q.get('tt')){DEMO.still=parseFloat(q.get('tt'));demoFrame()}else window.demo.start();
</script></body></html>
